name: meal-planning-agent
networks:
  default:
    name: main-network
services:
  agent-api:
    hostname: agent-api
    image: cjwilliams24680/meal-planning-agent:0.1.0
    depends_on:
      conversations-db:
        condition: service_healthy
        required: true
      users-db:
        condition: service_healthy
        required: true
        restart: true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - PUSHOVER_USER=${PUSHOVER_USER}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - CONVERSATIONS_DB_ENDPOINT=conversations-db:8000
      - CONVERSATIONS_DB_NAME=conversations
      - CONVERSATIONS_DB_USERNAME=conversations_user
      - CONVERSATIONS_DB_PASSWORD=${DB_PASSWORD}
      - USERS_DB_URL=users_user:${DB_PASSWORD}@users-db:5432/users
    ports:
      - mode: ingress
        protocol: tcp
        published: 8000 # this is the public facing port
        target: 8000 # this is the port that the application listens on. docker maps it to the published port
  conversations-db:
    hostname: conversations-db
    image: amazon/dynamodb-local:3.3.2
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - exit 0
      timeout: 15s
    read_only: true
    restart: always
    ports: []
  users-db:
    hostname: users-db
    image: postgres:18.6
    environment:
      - reschedule=on-node-failure
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=users
      - POSTGRES_USER=users_user
    healthcheck:
      interval: 10s
      retries: 30
      test:
        - CMD-SHELL
        - pg_isready -d users -U users_user
      timeout: 5s
    ports: []
    

