[project]
name = "meal-planning-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.20.0",
    "openai-agents>=0.19.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[project.scripts]
meal-planning-agent = "meal_planning_agent.main:run"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# The formatter wraps code at 88, but can't split long strings (prompts, Field
# descriptions), so E501 only flags lines the formatter can't fix beyond 120.
pycodestyle.max-line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nest-asyncio>=1.6.0",
    "ruff>=0.16.1",
]

